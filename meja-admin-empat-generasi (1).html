<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Meja Admin: Satu Hari, Empat Generasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E2A3A;--cream:#FFF6E5;--teal:#2EC4B6;--yellow:#FFD23F;--coral:#FF6B6B;--navy:#243B53;--lilac:#B9A6F2;--green:#7BD389;--fd:'Fredoka','Baloo 2','Trebuchet MS',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#16202c;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:100%;max-width:1000px;height:100vh;height:100dvh;max-height:600px;overflow:hidden;background:var(--cream);user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;color:var(--ink)}
.hide{display:none!important}
#stage{position:absolute;inset:0}
#world{width:100%;height:100%;display:block}

/* ===== actors ===== */
.actor .bob{animation:bob 2.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2.5px)}}
.actor.talking .bob{animation:bob .5s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.4s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.actor.talking .mouth{transform-box:fill-box;transform-origin:center top;animation:talk .15s infinite alternate}
@keyframes talk{to{transform:scaleY(.4)}}
.armL,.armR,.legL,.legR{transform-box:fill-box;transform-origin:50% 6%}
.actor.walking .bob{animation:wbob .38s infinite alternate ease-in-out}
@keyframes wbob{to{transform:translateY(-6px)}}
.actor.walking .legL{animation:leg .38s infinite alternate}
.actor.walking .legR{animation:leg .38s infinite alternate-reverse}
@keyframes leg{from{transform:rotate(16deg)}to{transform:rotate(-16deg)}}
.actor.walking .armL{animation:leg .38s infinite alternate-reverse}
.actor.walking .armR{animation:leg .38s infinite alternate}
.actor.wave .armR{animation:wave .32s infinite alternate ease-in-out}
@keyframes wave{from{transform:rotate(-115deg)}to{transform:rotate(-155deg)}}
.actor.busy .armL{animation:busy .16s infinite alternate}
.actor.busy .armR{animation:busy .16s infinite alternate-reverse}
@keyframes busy{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.ey,.br,.m{display:none}
[data-exp="neutral"] .ey-dot,[data-exp="neutral"] .br-n,[data-exp="neutral"] .m-n,
[data-exp="happy"] .ey-hap,[data-exp="happy"] .br-up,[data-exp="happy"] .m-hap,
[data-exp="sad"] .ey-dot,[data-exp="sad"] .br-sad,[data-exp="sad"] .m-sad,
[data-exp="angry"] .ey-dot,[data-exp="angry"] .br-ang,[data-exp="angry"] .m-ang,
[data-exp="shock"] .ey-shk,[data-exp="shock"] .br-up,[data-exp="shock"] .m-shk{display:inline}
.hp{transform-box:fill-box;transform-origin:center;animation:hp 1.4s forwards}
@keyframes hp{0%{transform:scale(0)}18%{transform:scale(1.25)}30%{transform:scale(1)}100%{transform:translateY(-46px);opacity:0}}
.steam.warm path{stroke:#fff;stroke-width:4;opacity:0;filter:drop-shadow(0 0 1.5px rgba(150,110,80,.8));animation:steamW 2.6s infinite ease-out}
.steam.warm path:nth-child(2){animation-delay:.85s}.steam.warm path:nth-child(3){animation-delay:1.7s}
@keyframes steamW{0%{opacity:0;transform:translateY(6px) scaleX(.8)}30%{opacity:.95}100%{opacity:0;transform:translateY(-18px) scaleX(1.3)}}
.warmglow{opacity:.25;animation:wg 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes wg{to{opacity:.45;transform:scale(1.15)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite alternate}
.sway.slow{animation-duration:5s}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.cloud{animation:cloud 26s linear infinite}
.cloud.c2{animation-duration:38s}
@keyframes cloud{from{transform:translateX(-120px)}to{transform:translateX(160px)}}
.rays{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.steam path{animation:steam 2.4s infinite ease-in-out}
.steam path:nth-child(2){animation-delay:.8s}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}50%{opacity:.9}100%{opacity:0;transform:translateY(-14px)}}
.glow{animation:glow 1.2s infinite alternate}
@keyframes glow{to{opacity:.35}}
#door{transform-box:fill-box;transform-origin:left center;transition:transform .7s cubic-bezier(.5,0,.3,1)}
#door.open{transform:scaleX(.12)}
.appear{animation:appear .5s}
@keyframes appear{from{opacity:0}}

/* ===== HUD ===== */
#hud{position:absolute;top:8px;left:8px;right:54px;display:flex;align-items:center;gap:8px;z-index:30;pointer-events:none}
.chip{background:#fff;border:2.5px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;gap:6px;padding:3px 11px;font-family:var(--fd);font-weight:600;font-size:16px;height:36px}
.chip svg{width:19px;height:19px;flex:none}
.meters{margin-left:auto;gap:10px}
.meter{display:flex;align-items:center;gap:4px}
.meter .bar{width:58px;height:11px;border:2px solid var(--ink);border-radius:6px;background:#EEE7DA;overflow:hidden}
.meter .fill{height:100%;width:50%;transition:width .7s cubic-bezier(.3,1.5,.5,1)}
#bgmBtn{position:absolute;top:8px;right:8px;z-index:60;width:38px;height:38px;border-radius:50%;background:var(--yellow);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center}
#bgmBtn svg{width:20px;height:20px}
#bgmBtn.off{background:#ddd}
.pop{position:absolute;z-index:31;font-family:var(--fd);font-weight:700;font-size:15px;padding:1px 8px;border-radius:999px;border:2px solid var(--ink);color:#fff;pointer-events:none;animation:popUp 1.3s forwards}
@keyframes popUp{0%{transform:translateY(6px) scale(.6);opacity:0}20%{transform:translateY(0) scale(1.1);opacity:1}100%{transform:translateY(26px);opacity:0}}

/* ===== dialog ===== */
#dlg{position:absolute;left:12px;right:12px;bottom:24px;z-index:20;margin:0 auto;max-width:760px;background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;gap:12px;padding:12px 40px 12px 14px;min-height:86px;animation:dlgIn .28s cubic-bezier(.3,1.5,.5,1)}
@keyframes dlgIn{from{transform:translateY(14px) scale(.96);opacity:0}}
.dlg-av{width:62px;height:62px;flex:none;border-radius:50%;border:3px solid var(--ink);overflow:hidden;background:#FFE8C7}
.dlg-av svg{width:100%;height:100%;display:block}
.dlg-name{display:inline-block;font-family:var(--fd);font-weight:600;font-size:14px;color:#fff;padding:1px 10px;border-radius:999px;border:2px solid var(--ink);margin-bottom:4px}
.dlg-role{font-size:12px;font-weight:800;color:#6b7280;margin-left:6px}
#dlg.narr .dlg-role{display:none}
#dlg.narr .hl{color:inherit;background:linear-gradient(transparent 52%,rgba(255,214,102,.9) 52%)}
.hl{font-weight:700;background:linear-gradient(transparent 50%,rgba(255,150,80,.42) 50%);padding:0 2px;border-radius:2px}
.dlg-text{font-family:var(--fd);font-weight:500;font-size:clamp(16px,2.3vw,20px);line-height:1.3;min-height:1.3em}
#dlg.narr{background:#E4DCFF;border-color:var(--ink);box-shadow:0 5px 0 var(--ink);color:var(--ink);justify-content:center;text-align:center;padding:14px 40px}
#dlg.narr .dlg-av,#dlg.narr .dlg-name{display:none}
.dlg-next{position:absolute;right:13px;bottom:10px;width:20px;height:20px;animation:nb .8s infinite alternate;opacity:0}
.dlg-next.on{opacity:1}
@keyframes nb{to{transform:translateY(4px)}}

/* ===== choices ===== */
#choices{position:absolute;left:0;right:0;bottom:22px;z-index:22;padding:0 12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.ch-prompt{background:var(--ink);color:#fff;font-family:var(--fd);font-weight:600;padding:6px 18px;border-radius:999px;font-size:17px;animation:popIn .3s backwards;text-align:center}
.ch-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;width:100%;max-width:840px}
.card{background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:9px 12px;display:flex;gap:10px;align-items:center;text-align:left;animation:popIn .4s cubic-bezier(.3,1.6,.5,1) backwards;transition:transform .1s}
.card:hover{transform:translateY(-2px)}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.card .ic{width:46px;height:46px;flex:none;border-radius:13px;border:2.5px solid var(--ink);display:grid;place-items:center;color:var(--ink);overflow:hidden}
.card .ic svg{width:27px;height:27px}
.card .ic.av svg{width:100%;height:100%}
.card b{font-family:var(--fd);font-weight:600;font-size:16px;display:block;line-height:1.15}
.card small{font-size:13px;color:#4d5868;line-height:1.2;display:block;margin-top:2px}
@keyframes popIn{from{transform:scale(.6);opacity:0}}
.ear-btn{display:flex;align-items:center;gap:6px;background:var(--lilac);border:2.5px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);padding:4px 12px;font-family:var(--fd);font-weight:600;font-size:14px;animation:popIn .3s .2s backwards}
.ear-btn svg{width:18px;height:18px}
.ear-btn span{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 7px;font-size:12px}
.hint-note{display:flex;gap:8px;align-items:center;background:#FFF3B0;border:2.5px dashed var(--ink);border-radius:12px;padding:6px 12px;font-size:14px;font-weight:700;max-width:560px;animation:popIn .3s}
.hint-note svg{width:20px;height:20px;flex:none}

/* ===== phone ===== */
#phone{position:absolute;inset:0;z-index:25;display:grid;place-items:center;background:rgba(30,42,58,.45);animation:appear .25s}
.ph{width:min(300px,86%);height:min(440px,84%);background:#fff;border:4px solid var(--ink);border-radius:30px;box-shadow:0 7px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column;animation:phIn .5s cubic-bezier(.3,1.5,.5,1);position:relative}
@keyframes phIn{from{transform:translateY(80px) rotate(8deg);opacity:0}}
.ph-top{background:var(--teal);padding:16px 14px 10px;font-family:var(--fd);font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px;border-bottom:3px solid var(--ink)}
.ph-top svg{width:20px;height:20px}
.ph-notch{position:absolute;top:5px;left:50%;width:60px;height:7px;margin-left:-30px;background:var(--ink);border-radius:9px}
.ph-msgs{flex:1;padding:10px;display:flex;flex-direction:column;gap:8px;overflow:hidden;justify-content:flex-end;background:#F3EEE3}
.msg{max-width:86%;display:flex;gap:6px;align-items:flex-end;animation:popIn .3s cubic-bezier(.3,1.6,.5,1)}
.msg .av{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);overflow:hidden;flex:none;background:#FFE8C7}
.msg .av svg{width:100%;height:100%;display:block}
.msg .bub{background:#fff;border:2px solid var(--ink);border-radius:14px 14px 14px 4px;padding:6px 10px;font-size:14px;font-weight:700;line-height:1.25}
.msg .who{display:block;font-size:11px;font-weight:800;margin-bottom:1px}
.msg .who i,.role{font-style:normal;font-weight:700;color:#6b7280}
.ph-top .ttl2{display:flex;flex-direction:column;line-height:1.1}.ph-top .ttl2 small{font-size:11px;font-weight:500;opacity:.85}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bub{background:#C9F2EC;border-radius:14px 14px 4px 14px}
.msg.sys{align-self:center}
.msg.sys .bub{background:transparent;border:none;font-style:italic;color:#6b7280;font-weight:600}
.msg .sticker{width:86px;height:86px;display:block}
.msg .photo{width:170px;display:block;border-radius:8px;border:2px solid var(--ink)}
.ph-msgs.feed{justify-content:flex-start}
.ph-msgs.ffing .msg{animation-duration:.12s}
.ph-msgs.ffing{filter:blur(.5px)}
.unread{margin-left:auto;background:var(--coral);color:#fff;border:2px solid var(--ink);border-radius:999px;font-size:13px;min-width:28px;text-align:center;padding:0 7px;transition:transform .1s}
.ff{position:absolute;top:62px;right:12px;z-index:2;display:flex;align-items:center;gap:4px;background:var(--yellow);border:2.5px solid var(--ink);border-radius:999px;padding:2px 10px;font-family:var(--fd);font-weight:700;font-size:14px;box-shadow:0 3px 0 var(--ink);animation:popIn .3s,ffp .35s .3s infinite alternate}
.ff svg{width:16px;height:16px}
@keyframes ffp{to{transform:scale(1.1)}}
.msg.ann .bub{background:#FDE3C8;border-width:2.5px;font-size:15px}
.typing{display:flex;gap:4px;padding:8px 12px;background:#fff;border:2px solid var(--ink);border-radius:14px;align-self:flex-start;margin-left:36px}
.typing i{width:7px;height:7px;background:var(--ink);border-radius:50%;animation:td .9s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes td{50%{transform:translateY(-4px);opacity:.4}}
.tap-hint{font-family:var(--fd);font-size:13px;font-weight:500;color:#6b7280;text-align:center;margin-top:8px;animation:nb .8s infinite alternate}
.ph .tap-hint{margin:0;padding:6px;background:#fff;border-top:2px solid #eee}
.call{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--navy);color:#fff;font-family:var(--fd)}
.call .ring{width:96px;height:96px;border-radius:50%;background:var(--coral);border:3px solid #fff;display:grid;place-items:center;animation:ringp .6s infinite alternate}
.call .ring svg{width:46px;height:46px;color:#fff}
@keyframes ringp{to{transform:scale(1.08) rotate(-8deg);box-shadow:0 0 0 14px rgba(255,107,107,.3)}}

/* ===== split ===== */
#split{position:absolute;inset:0;z-index:24;display:flex}
.sp{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:56px 18px 52px;min-height:0}
.sp .who{display:flex;flex-direction:column;align-items:center;gap:6px}
.sp .bubs{display:flex;flex-direction:column;align-items:center;gap:8px}
.sp-l{background:#C9B8F7;clip-path:polygon(0 0,100% 0,90% 100%,0 100%);animation:slL .5s cubic-bezier(.3,1.3,.5,1)}
.sp-r{background:#F6BE8F;clip-path:polygon(10% 0,100% 0,100% 100%,0 100%);margin-left:-6%;animation:slR .5s cubic-bezier(.3,1.3,.5,1)}
@keyframes slL{from{transform:translateX(-100%)}}
@keyframes slR{from{transform:translateX(100%)}}
.sp .big{width:min(140px,26vh);height:min(140px,26vh);border-radius:50%;border:4px solid var(--ink);overflow:hidden;background:#FFF6E5;box-shadow:0 5px 0 var(--ink)}
.sp .big svg{width:100%;height:100%;display:block}
.sp .nm{font-family:var(--fd);font-weight:600;background:var(--ink);color:#fff;padding:2px 12px;border-radius:12px;font-size:14px;text-align:center;line-height:1.15}
.sp .nm small{display:block;font-size:11px;font-weight:500;opacity:.8}
.sp .bub{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:7px 12px;font-family:var(--fd);font-weight:500;font-size:16px;max-width:250px;text-align:center;animation:popIn .35s cubic-bezier(.3,1.6,.5,1) backwards;line-height:1.25}
.sp .bub.me{background:#C9F2EC;font-size:14px}
.sp .bub.me::before{content:attr(data-who);display:block;font-size:11px;font-weight:700;color:#1A9E92}
#split .tap-hint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 12px;margin:0}

/* ===== title card / wipe / kinetic / panel ===== */
#card{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:var(--cc,#2EC4B6);overflow:hidden;animation:irisIn .55s cubic-bezier(.7,0,.3,1)}
#card.out{animation:irisOut .5s cubic-bezier(.7,0,.3,1) forwards}
@keyframes irisIn{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(80% at 50% 50%)}}
@keyframes irisOut{from{clip-path:circle(80% at 50% 50%)}to{clip-path:circle(0% at 50% 50%)}}
#card::before{content:"";position:absolute;width:220%;height:220%;left:-60%;top:-60%;background:repeating-conic-gradient(rgba(255,255,255,.13) 0 9deg,transparent 9deg 18deg);animation:spin 30s linear infinite}
.cd-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.cd-clock{width:clamp(70px,14vh,100px);animation:popIn .5s .1s cubic-bezier(.3,1.6,.5,1) backwards}
.cd-clock line{transition:transform 1.1s cubic-bezier(.5,0,.2,1)}
.cd-time{font-family:var(--fd);font-weight:700;font-size:clamp(50px,11vh,84px);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);line-height:1;animation:popIn .5s .2s cubic-bezier(.3,1.6,.5,1) backwards}
.cd-title{background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:6px 20px;border-radius:999px;font-family:var(--fd);font-weight:600;font-size:clamp(17px,3vw,24px);transform:rotate(-2deg);animation:popIn .45s .4s cubic-bezier(.3,1.6,.5,1) backwards;text-align:center;max-width:90%}
#wipe{position:absolute;top:0;bottom:0;left:-25%;width:150%;z-index:39;pointer-events:none;background:linear-gradient(90deg,var(--coral) 0 6%,var(--yellow) 6% 94%,var(--teal) 94%);transform:translateX(-110%) skewX(-12deg)}
#wipe.in{animation:wIn .42s cubic-bezier(.7,0,.3,1) forwards}
#wipe.out{animation:wOut .42s cubic-bezier(.7,0,.3,1) forwards}
@keyframes wIn{from{transform:translateX(-110%) skewX(-12deg)}to{transform:translateX(0) skewX(-12deg)}}
@keyframes wOut{from{transform:translateX(0) skewX(-12deg)}to{transform:translateX(110%) skewX(-12deg)}}
#kin{position:absolute;inset:0;z-index:23;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:rgba(255,246,229,.9);padding:20px;text-align:center;animation:appear .25s}
.kw{font-family:var(--fd);font-weight:700;font-size:clamp(28px,6.5vh,50px);line-height:1.1;color:var(--ink);animation:kwIn .5s cubic-bezier(.3,1.7,.5,1) backwards}
.kw:nth-child(3n+2){color:#E2504F}.kw:nth-child(3n+3){color:#1A9E92}
@keyframes kwIn{from{transform:scale(.3) rotate(-6deg);opacity:0}}
#panel{position:absolute;inset:0;z-index:26;display:grid;place-items:center;background:rgba(30,42,58,.35);padding:56px 14px 30px;animation:appear .2s}
#panel.side{background:transparent;justify-items:end;padding-right:5%}
.pn{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:16px 18px;width:min(400px,100%);animation:popIn .4s cubic-bezier(.3,1.5,.5,1);max-height:100%;overflow:auto}
.pn-title{font-family:var(--fd);font-weight:700;font-size:20px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pn-title svg{width:24px;height:24px}
.row{display:flex;align-items:center;gap:10px;padding:6px 0;animation:popIn .35s backwards}
.row .ti{width:38px;height:38px;flex:none;border-radius:11px;border:2.5px solid var(--ink);display:grid;place-items:center;overflow:hidden}
.row .ti svg{width:22px;height:22px}
.row .ti.av svg{width:100%;height:100%}
.row b{font-family:var(--fd);font-weight:600;font-size:16px;display:block;line-height:1.1}
.row small{font-size:13px;color:#4d5868;display:block}
.st{margin-left:auto;font-family:var(--fd);font-weight:600;font-size:13px;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.st svg{width:14px;height:14px}
.pf{display:flex;gap:12px;align-items:center}
.pf-av{width:84px;height:84px;border-radius:50%;border:3px solid var(--ink);overflow:hidden;background:#FFE8C7;flex:none}
.pf-av svg{width:100%;height:100%;display:block}
.pf-name{font-family:var(--fd);font-weight:700;font-size:22px;line-height:1.1}
.pf-role{font-weight:800;font-size:13px;color:#4d5868}
.pf-tag{display:inline-block;margin-top:4px;color:#fff;font-family:var(--fd);font-weight:600;font-size:13px;border:2px solid var(--ink);border-radius:999px;padding:1px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 8px}
.tchip{background:var(--cream);border:2px solid var(--ink);border-radius:10px;padding:3px 10px;font-weight:700;font-size:14px}
.pf-power{display:flex;gap:6px;align-items:center;font-weight:800;font-size:14px;color:#1A9E92}
.pf-power svg{width:18px;height:18px}
.info{text-align:center}

const mtof=m=>440*Math.pow(2,(m-69)/12);
function auInit(){
 if(AU.ctx)return;
 try{
  const C=new(window.AudioContext||window.webkitAudioContext)();AU.ctx=C;
  AU.out=C.createGain();AU.out.gain.value=.8;AU.out.connect(C.destination);
  AU.bgm=C.createGain();AU.bgm.gain.value=AU.on?.55:0;AU.bgm.connect(AU.out);
  AU.sfx=C.createGain();AU.sfx.gain.value=.6;AU.sfx.connect(AU.out);
  const len=C.sampleRate*.5,b=C.createBuffer(1,len,C.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noise=b;
  AU.next=C.currentTime+.1;setInterval(sched,30);
 }catch(e){}
}
function note(m,t,dur,type,vol){const C=AU.ctx,o=C.createOscillator(),g=C.createGain();o.type=type;o.frequency.value=mtof(m);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AU.bgm);o.start(t);o.stop(t+dur+.05)}
function hat(t){const C=AU.ctx,s=C.createBufferSource(),f=C.createBiquadFilter(),g=C.createGain();s.buffer=AU.noise;f.type='highpass';f.frequency.value=7000;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);s.connect(f);f.connect(g);g.connect(AU.bgm);s.start(t);s.stop(t+.06)}
function sched(){
 const C=AU.ctx;if(!C)return;const M=MOODS[AU.mood],sp=60/M.bpm/2;
 if(AU.next<C.currentTime)AU.next=C.currentTime+.05;
 while(AU.next<C.currentTime+.15){
  const t=AU.next,s=AU.step,bar=Math.floor(s/8)%M.prog.length,i=s%8,ch=M.prog[bar],pat=[0,1,2,3,2,1,2,1];
  note(ch[pat[i]%ch.length]+12,t,.42,'triangle',.1);
  if(i===0||i===4)note(M.bass[bar],t,sp*3.6,'sine',.24);
  if(i===6&&s%16===14)note(ch[ch.length-1]+24,t,.6,'sine',.05);
  if(M.hat&&i%2===1)hat(t);
  AU.step++;AU.next+=sp;
 }
}
function tone(f,d,type='sine',v=.2,slide=null,delay=0){if(!AU.ctx)return;const C=AU.ctx,t=C.currentTime+delay,o=C.createOscillator(),g=C.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AU.sfx);o.start(t);o.stop(t+d+.03)}

const world=$('#world');let vb={x:0,y:0,w:900,h:500},camF={x:0,y:40,w:900,h:400},camRAF=0,camRes=null;
function camRect(f){
 const r=$('#stage').getBoundingClientRect(),W=r.width||900,H=r.height||500;
 const T=Math.min(54,H*.1),R=W<H?H*.4:Math.min(160,H*.29),av=Math.max(80,H-T-R);
 const s=Math.min(W/f.w,av/f.h),w=W/s,h=H/s;
 return{x:f.x+f.w/2-w/2,y:f.y-T/s-(av/s-f.h)/2,w,h};
}
function setVB(v){vb=v;world.setAttribute('viewBox',`${v.x} ${v.y} ${v.w} ${v.h}`)}
function cam(f,dur=900,ease='io'){
 camF=f;const to=camRect(f);cancelAnimationFrame(camRAF);if(camRes){camRes();camRes=null}
 if(!dur){setVB(to);return Promise.resolve()}
 const fr={...vb},t0=performance.now();
 return new Promise(res=>{camRes=res;const step=n=>{const p=Math.min(1,(n-t0)/dur),e=ease==='lin'?p:(p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2);
  setVB({x:fr.x+(to.x-fr.x)*e,y:fr.y+(to.y-fr.y)*e,w:fr.w+(to.w-fr.w)*e,h:fr.h+(to.h-fr.h)*e});
  if(p<1)camRAF=requestAnimationFrame(step);else{camRes=null;res()}};camRAF=requestAnimationFrame(step)});
}
window.addEventListener('resize',()=>cam(camF,0));

function typeText(el,text){
 const segs=[];String(text).split(/(\*\*.+?\*\*)/).forEach(p=>{if(!p)return;const em=p.startsWith('**')&&p.endsWith('**');segs.push({t:em?p.slice(2,-2):p,em})});
 const total=segs.reduce((a,b)=>a+b.t.length,0);
 const draw=n=>{let h='',r=n;for(const sg of segs){if(r<=0)break;const part=esc(sg.t.slice(0,r));h+=sg.em?`<b class="hl">${part}</b>`:part;r-=sg.t.length}el.innerHTML=h};
 return new Promise(res=>{let i=0;draw(0);const iv=setInterval(()=>{i++;draw(i);if(i%3===0)sfx.type();if(i>=total){clearInterval(iv);tapR=null;res()}},24);tapR=()=>{clearInterval(iv);draw(total);res()}})}
